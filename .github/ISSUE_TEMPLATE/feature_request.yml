name: 功能建议
description: 提议新的能力或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 描述需要解决的问题，而非只描述实现方式
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 兼容性与安全影响
      description: 说明数据、配置、依赖、迁移或部署影响
